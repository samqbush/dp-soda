# Keeps the katabatic meter archive current without any manual work.
#
# Why this exists: the validation dataset in research/katabatic-prediction.md is only useful if
# it keeps growing, and the owner of this repo travels for work and will not hand-maintain a
# dataset. Everything here is machine-derived (see §3.4) — no human ever enters a row.
#
# Two failure modes this is deliberately designed around:
#
#  1. Ecowitt only retains fine-resolution history for a limited window and downsamples older
#     data to 4-hour rows, which are useless for a 30-minute sustained-wind label (§4.3a).
#     Missing a long stretch permanently costs that resolution, so this runs daily.
#  2. The meter goes dark every winter (§4.2, roughly Jan 6 - Feb 28). A workflow that emails a
#     failure every morning for 54 straight days gets muted, and a muted workflow is a dead one.
#     Shutdown days are recorded as `unobserved` and exit cleanly - never as calm, never as an error.

name: 🌬️ Katabatic archive

on:
  schedule:
    # 14:00 UTC = 07:00 MDT / 06:00 MST. Runs well after the morning event is over, and archives
    # a trailing window rather than just "today", so a skipped run self-heals on the next one.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many trailing days to archive'
        required: false
        default: '7'

# Prevent two runs racing on the same commit.
concurrency:
  group: katabatic-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Archive and re-score
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Archive recent meter history
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
        # The archiver is idempotent and re-runs a trailing window, so a missed day is picked up
        # automatically. --delay stays above the undocumented Ecowitt rate cap (§4.3); a
        # rate-limited day is skipped rather than written, so it is never mistaken for calm.
        run: |
          node scripts/archive-ecowitt.mjs \
            --days "${{ github.event.inputs.days || 7 }}" \
            --delay 1200

      - name: 🔁 Re-run backtest and score
        # Cheap (seconds, no network) and keeps the committed prediction log in step with the
        # archive. If either script fails the run fails loudly - a silently stale log would be
        # worse than no log.
        run: |
          node scripts/backtest-katabatic.mjs --out research/prediction-log.csv
          node scripts/score-backtest.mjs --call-time 06:30 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 💾 Commit any new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ecowitt-archive research/prediction-log.csv

          # No-op days are normal, not failures: nothing new during the winter shutdown, or a
          # re-run over days already archived. Exit clean rather than committing an empty diff.
          if git diff --staged --quiet; then
            echo "No new data to commit (expected during the winter shutdown - see §4.2)."
            exit 0
          fi

          git commit -m "chore(data): archive katabatic meter history [skip ci]"
          git push
