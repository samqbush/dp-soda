# Upgrade test, step 2: runs after the new build is installed over the previous
# release. The 35 mph wind threshold saved on the previous release must remain.
appId: com.samqbush.dpsoda
name: Upgrade - settings survive the upgrade
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-settings"
    timeout: 90000
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible: "Configure your app preferences"
    timeout: 15000
- assertVisible: "35 mph"
- takeScreenshot: 05-upgraded-settings
